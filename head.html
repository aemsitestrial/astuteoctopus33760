<meta name="viewport" content="width=device-width, initial-scale=1"/>
<!-- Adobe Target flicker pre-hide (FOOC). Runs synchronously during head parse,
     only on target pages (gated on the target meta, which EDS injects above this
     file). Masks the TEXT of top-level Intent Sections (main > div[id]) BEFORE
     first paint, so the default copy never flashes ahead of the personalized
     offer. scripts/target/flicker.js takes over granular masking and removes
     this bridge style (dismissPrehide) once it owns the DOM; a self-timeout
     failsafe reveals content if that module never loads. -->
<script>
  (function () {
    try {
      if (!document.querySelector('meta[name="target"]')) return;
      var TEXT = 'main > div[id] :is(h1,h2,h3,h4,h5,h6,p,li,a,span,td,th,dt,dd)';
      var style = document.createElement('style');
      style.id = 'target-prehide';
      style.textContent = TEXT + '{color:transparent !important;}'
        + TEXT + ' *{color:transparent !important;}';
      document.head.appendChild(style);
      window.setTimeout(function () {
        var el = document.getElementById('target-prehide');
        if (el) el.remove();
      }, 4000);
    } catch (e) { /* never block rendering on the pre-hide */ }
  }());
</script>
<script src="/scripts/aem.js" type="module"></script>
<script src="/scripts/scripts.js" type="module"></script>
<link rel="stylesheet" href="/styles/styles.css"/>
